name: Build DirectLaunch TV APK

on:
  workflow_dispatch:
  push:
    branches: [ "main", "master" ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android 35 SDK
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Install stable debug signing key
        run: |
          mkdir -p "$HOME/.android"
          base64 --decode signing/directlaunch-debug.keystore.b64 > "$HOME/.android/debug.keystore"
          chmod 600 "$HOME/.android/debug.keystore"

      - name: Build debug APK
        run: gradle --no-daemon :app:assembleDebug

      - name: Prepare public APK
        run: cp app/build/outputs/apk/debug/app-debug.apk DirectLaunchTV.apk

      - name: Upload Actions artifact
        uses: actions/upload-artifact@v4
        with:
          name: DirectLaunchTV-debug-apk
          path: DirectLaunchTV.apk
          if-no-files-found: error
          retention-days: 7

      - name: Publish public GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest DirectLaunchTV.apk --clobber
            gh release edit latest --notes "DirectLaunch TV 0.2.0. Fixes Google TV target-app selection and accessibility remote-shortcut activation. Debug-signed for sideloading."
          else
            gh release create latest DirectLaunchTV.apk --title "DirectLaunch TV" --notes "DirectLaunch TV 0.2.0. Fixes Google TV target-app selection and accessibility remote-shortcut activation. Debug-signed for sideloading."
          fi
